    <rect x="240" width="270" height="44" rx="22" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="264" y="29" font-size="18" font-weight="700" fill="#0f172a">14 jours gratuits · sans CB</text>
    <text x="1040" y="29" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">fatiabill.ch</text>
