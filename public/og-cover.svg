<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="FatiaBill — Le copilote de vos finances">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(80,72)">
    <rect width="56" height="56" rx="14" fill="#10b981"/>
    <text x="28" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle">F</text>
    <text x="74" y="38" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#0f172a">FatiaBill</text>
  </g>
  <g transform="translate(80,250)">
