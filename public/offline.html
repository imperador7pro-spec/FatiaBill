<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10b981">
  <title>Hors ligne — FatiaBill</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafaf9;
      color: #1c1917;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      padding: 32px 24px;
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 24px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1);
    }
    .icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 18px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-style: italic;
      font-size: 28px;
    }
    h1 {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      color: #57534e;
      line-height: 1.55;
      margin-bottom: 22px;
    }
    .btn {
      display: inline-block;
      padding: 12px 22px;
      background: #059669;
      color: white;
      font-weight: 700;
      font-size: 13px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .btn:hover { background: #047857; }
    .hint {
      margin-top: 16px;
      font-size: 11px;
      color: #78716c;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">F</div>
    <h1>Hors ligne</h1>
    <p>
      Vous n'êtes pas connecté à Internet. FatiaBill a besoin du réseau pour synchroniser vos données et accéder au coach IA.
    </p>
    <button class="btn" onclick="location.reload()">Réessayer</button>
    <p class="hint">Vos données saisies hors ligne ne sont pas perdues — elles se synchroniseront automatiquement à la reconnexion.</p>
  </div>
</body>
</html>
